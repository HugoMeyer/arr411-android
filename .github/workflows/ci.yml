name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older run. A run of main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A smoke check: the APK is built to prove that it compiles, then thrown away. Nothing is uploaded or released.
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # build.ps1 looks for arr411-chrome next to this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: arr411-android
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HugoMeyer/arr411-chrome
          path: arr411-chrome
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      # 26 is the current LTS.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # build.ps1 and test.ps1 want $ARR411_TOOLCHAIN\jdk and \sdk (with build-tools\34.0.0 and platforms\android-34).
      # The JDK is the one of setup-java and the SDK the one of the runner image, both linked by junctions:
      # the image keeps its SDK behind a path with spaces.
      - name: Assemble the toolchain
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk -or -not (Test-Path -LiteralPath $sdk)) { throw "No Android SDK (ANDROID_HOME='$env:ANDROID_HOME', ANDROID_SDK_ROOT='$env:ANDROID_SDK_ROOT')" }
          if (-not $env:JAVA_HOME -or -not (Test-Path -LiteralPath "$env:JAVA_HOME\bin\javac.exe")) { throw "No JDK (JAVA_HOME='$env:JAVA_HOME')" }
          $mgr = "$sdk\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $mgr)) { throw "sdkmanager not found: $mgr" }

          # The two packages are installed even when the image has them, so that the job does not depend on the image content.
          # sdkmanager reads its answers to the licence prompts on stdin: a 'y' per prompt, the surplus is never read.
          function Invoke-SdkManager([string[]]$SdkArgs) {
            (1..60 | ForEach-Object { 'y' }) | & $mgr "--sdk_root=$sdk" @SdkArgs
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager $SdkArgs failed with exit code $LASTEXITCODE" }
          }
          Invoke-SdkManager '--licenses'
          Invoke-SdkManager '--install', 'build-tools;34.0.0', 'platforms;android-34'

          $tc = Join-Path $env:RUNNER_TEMP 'android-toolchain'
          New-Item -ItemType Directory -Path $tc | Out-Null
          New-Item -ItemType Junction -Path "$tc\jdk" -Target $env:JAVA_HOME | Out-Null
          New-Item -ItemType Junction -Path "$tc\sdk" -Target $sdk | Out-Null

          $bt = "$tc\sdk\build-tools\34.0.0"
          $missing = @(
            "$tc\jdk\bin\javac.exe", "$tc\jdk\bin\java.exe", "$tc\jdk\bin\keytool.exe",
            "$bt\aapt2.exe", "$bt\d8.bat", "$bt\zipalign.exe", "$bt\apksigner.bat",
            "$tc\sdk\platforms\android-34\android.jar"
          ) | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "The toolchain is incomplete:`n$($missing -join "`n")" }
          "jdk -> $env:JAVA_HOME"
          "sdk -> $sdk"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ARR411_TOOLCHAIN=$tc`n")

      # The keystore is created by build.ps1 from a password that exists only in this step: it is not a secret, nothing keeps it.
      # build.ps1 and test.ps1 are Windows PowerShell 5.1 scripts: they run the way their usage line says.
      - name: Build the APK
        working-directory: arr411-android
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()
          $env:ARR411_KEYSTORE_PASS = -join ($bytes | ForEach-Object { $_.ToString('x2') })
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -NoCopy

      - name: Run the Java and shim tests
        working-directory: arr411-android
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test.ps1

      # node --test runs every *.test.js under test/spa/, including the ones added later, but passes when it finds none.
      - name: Run the web app tests
        working-directory: arr411-android
        shell: pwsh
        run: |
          if (-not (Get-ChildItem test/spa -Recurse -Filter *.test.js)) { throw 'No test/spa/**/*.test.js file: node --test would run nothing and still pass' }
          node --test test/spa/
